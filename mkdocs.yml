site_name: Background Job Tracker
site_description: Developer-first observability, real-time telemetry, and automated incident response for background jobs.
site_author: Vishwajit Herma

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - SDK Quickstart: getting-started/sdk-quickstart.md
  - Features:
      - AI Reliability Assistant: features/ai-reliability-assistant.md
      - Incident Management & Runbooks: features/incident-management.md
      - Alerting & Notifications: features/alerting-and-notifications.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Domain Model: architecture/domain-model.md
  - Development:
      - Testing & Quality: development/testing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

plugins:
  - search
