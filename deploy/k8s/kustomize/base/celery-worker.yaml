apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-job-tracker-celery-worker
  labels:
    app: background-job-tracker
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: background-job-tracker
      component: celery-worker
  template:
    metadata:
      labels:
        app: background-job-tracker
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: background-job-tracker:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run celery -A config worker -l info
              envFrom:
            - configMapRef:
                name: background-job-tracker-config
            - secretRef:
                name: background-job-tracker-secrets
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-job-tracker-celery-beat
  labels:
    app: background-job-tracker
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: background-job-tracker
      component: celery-beat
  template:
    metadata:
      labels:
        app: background-job-tracker
        component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: background-job-tracker:latest
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              uv run celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
              envFrom:
            - configMapRef:
                name: background-job-tracker-config
            - secretRef:
                name: background-job-tracker-secrets
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
