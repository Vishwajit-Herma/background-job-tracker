apiVersion: v1
kind: ConfigMap
metadata:
  name: background-job-tracker-config
data:
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "config.settings.prod"
  DJANGO_ALLOWED_HOSTS: "background-job-tracker.example.com,background-job-tracker-web,*"
  DATABASE_URL: "postgresql://background-job-tracker_user:changeme@background-job-tracker-pg-rw:5432/background-job-tracker_db"
  REDIS_URL: "redis://background-job-tracker-redis-master:6379/0"
  CELERY_BROKER_URL: "redis://background-job-tracker-redis-master:6379/1"
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.example.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "True"
  UV_NO_CACHE: "1"
