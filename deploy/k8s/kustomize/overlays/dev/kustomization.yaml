apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

# Development-specific configurations
replicas:
  - name: background-job-tracker-web
    count: 1

  - name: background-job-tracker-celery-worker
    count: 1


# Development-specific patches
patches:
  - target:
      kind: Deployment
      name: background-job-tracker-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
