apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: background_job_tracker-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  storage:
    size: 10Gi
    storageClass: standard

  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"

  bootstrap:
    initdb:
      database: background_job_tracker_db
      owner: background_job_tracker_user
      secret:
        name: background_job_tracker-pg-credentials

  backup:
    barmanObjectStore:
      destinationPath: s3://your-bucket/background_job_tracker/
      s3Credentials:
        accessKeyId:
          name: background_job_tracker-s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: background_job_tracker-s3-credentials
          key: SECRET_ACCESS_KEY
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true
