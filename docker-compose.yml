services:
  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-docker-dev-key

      - DATABASE_URL=postgresql://background_job_tracker_user:background_job_tracker_password@db:5432/background_job_tracker_db


      - REDIS_URL=redis://redis:6379/0


      - CELERY_BROKER_URL=redis://redis:6379/1

      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025

      - UV_NO_CACHE=1


    env_file:
      - path: .env
        required: false

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: background_job_tracker_db
      POSTGRES_USER: background_job_tracker_user
      POSTGRES_PASSWORD: background_job_tracker_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U background_job_tracker_user -d background_job_tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5



  celery-worker:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: uv run celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-docker-dev-key

      - DATABASE_URL=postgresql://background_job_tracker_user:background_job_tracker_password@db:5432/background_job_tracker_db


      - REDIS_URL=redis://redis:6379/0

      - CELERY_BROKER_URL=redis://redis:6379/1
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025

      - UV_NO_CACHE=1

    env_file:
      - path: .env
        required: false

  celery-beat:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: uv run celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-docker-dev-key

      - DATABASE_URL=postgresql://background_job_tracker_user:background_job_tracker_password@db:5432/background_job_tracker_db


      - REDIS_URL=redis://redis:6379/0

      - CELERY_BROKER_URL=redis://redis:6379/1
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025

      - UV_NO_CACHE=1

    env_file:
      - path: .env
        required: false


  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"





  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "4318:4318"    # OTLP gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"


volumes:
  postgres_data:

  redis_data:
