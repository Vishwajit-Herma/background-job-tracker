[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "background-job-tracker-sdk"
version = "0.1.0"
description = "Python SDK for Background Job Tracker"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31",
    "celery>=5.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["background_job_tracker*"]